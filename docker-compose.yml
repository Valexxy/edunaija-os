version: '3.8'
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: edunaija-backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - edunaija_data:/app/backend/database
    environment:
      - ENVIRONMENT=production
      - PORT=8000

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: edunaija-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_BACKEND_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  edunaija_data:
    driver: local