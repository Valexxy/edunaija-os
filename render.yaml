services:
  # Main FastAPI Backend (100% Free Web Service on Render)
  - type: web
    name: edunaija-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ENVIRONMENT
        value: production
      - fromGroup: jamb-ai-tutor-secrets

envVarGroups:
  - name: jamb-ai-tutor-secrets
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: AFRICAS_TALKING_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
